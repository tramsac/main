<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tạo Link cấu hình</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            resize: vertical;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .copy-btn {
            margin-top: 10px;
            background: #28a745;
        }

        .copy-btn:hover {
            background: #1e7e34;
        }

        .json-preview {
            margin-top: 15px;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>


<body>

<div class="container">

    <h2>Tạo Link cấu hình</h2>


    <!-- DEVICE ID -->
    <div class="form-group">

        <label>Device ID</label>

        <input
            type="text"
            id="device_id"
            placeholder="3076f593d750"
        >

    </div>


    <!-- ACTION URL -->
    <div class="form-group">

        <label>Action URL</label>

        <input
            type="text"
            id="action_url"
            placeholder="https://example.com/action"
        >

    </div>


    <!-- MQTT URL -->
    <div class="form-group">

        <label>MQTT URL (murl)</label>

        <input
            type="text"
            id="murl"
            placeholder="wss://broker.hivemq.com:8884/mqtt"
        >

    </div>


    <!-- USER ID -->
    <div class="form-group">

        <label>User ID</label>

        <input
            type="text"
            id="user_id"
            placeholder="1234"
        >

    </div>


    <!-- HOME ID -->
    <div class="form-group">

        <label>Home ID</label>

        <input
            type="text"
            id="home_id"
            placeholder="5678"
        >

    </div>


    <!-- APP ID -->
    <div class="form-group">

        <label>App ID</label>

        <input
            type="text"
            id="app_id"
            placeholder="tuyduc"
        >

    </div>


    <!-- CREATE LINK -->
    <button onclick="generateLink()">
        TẠO LINK
    </button>


    <!-- RESULT -->
    <div class="result">

        <label>Link kết quả</label>

        <textarea
            id="result"
            readonly
            placeholder="Link sẽ xuất hiện ở đây..."
        ></textarea>


        <button
            class="copy-btn"
            onclick="copyLink()"
        >
            COPY LINK
        </button>


        <!-- JSON PREVIEW -->
        <div class="json-preview">

            <strong>JSON:</strong>

            <div id="jsonPreview"></div>

        </div>

    </div>

</div>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const MAIN_URL = "https://tramsac.github.io/main/";


/*************************************************
 * ENCODE JSON -> BASE64URL
 *************************************************/

function encodeLS(config) {

    /*
     * Chuyển object thành JSON
     */

    const json = JSON.stringify(config);


    /*
     * JSON -> UTF-8
     */

    const bytes = new TextEncoder().encode(json);


    /*
     * UTF-8 -> binary string
     */

    let binary = "";

    bytes.forEach(byte => {

        binary += String.fromCharCode(byte);

    });


    /*
     * Binary -> Base64
     */

    let base64 = btoa(binary);


    /*
     * Base64 -> Base64URL
     *
     * + -> -
     * / -> _
     * = -> bỏ
     */

    base64 = base64
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");


    return base64;
}


/*************************************************
 * GET INPUT VALUE
 *************************************************/

function getValue(id) {

    return document
        .getElementById(id)
        .value
        .trim();

}


/*************************************************
 * GENERATE LINK
 *************************************************/

function generateLink() {


    /*
     * Lấy dữ liệu từ form
     */

    const config = {

        device_id: getValue("device_id"),

        action_url: getValue("action_url"),

        murl: getValue("murl"),

        user_id: getValue("user_id"),

        home_id: getValue("home_id"),

        app_id: getValue("app_id")

    };


    /*
     * Xóa các giá trị rỗng
     */

    Object.keys(config).forEach(key => {

        if (!config[key]) {

            delete config[key];

        }

    });


    /*
     * Encode
     */

    const ls = encodeLS(config);


    /*
     * Tạo link
     */

    const link =
        MAIN_URL +
        "?ls=" +
        ls;


    /*
     * Hiển thị link
     */

    document.getElementById("result").value = link;


    /*
     * Hiển thị JSON để kiểm tra
     */

    document.getElementById("jsonPreview").textContent =
        JSON.stringify(config, null, 2);

}


/*************************************************
 * COPY LINK
 *************************************************/

function copyLink() {

    const result =
        document.getElementById("result");


    if (!result.value) {

        alert("Chưa có link!");

        return;

    }


    /*
     * Copy clipboard
     */

    navigator.clipboard.writeText(result.value)

        .then(() => {

            alert("Đã copy link!");

        })

        .catch(() => {

            /*
             * Fallback cho trình duyệt cũ
             */

            result.select();

            document.execCommand("copy");

            alert("Đã copy link!");

        });

}

</script>


</body>

</html>
